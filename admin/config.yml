backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

publish_mode: simple

locale: "en"

collections:
  - name: "site"
    label: "ওয়েবসাইট ছবি"
    files:
      - name: "data"
        label: "সব ছবি এখান থেকে বদলান"
        file: "site-data.json"
        fields:
          - label: "উপরের স্লাইডশো (৩ সেকেন্ড পরপর বদলানো ছবি)"
            name: "hero"
            widget: "list"
            summary: "{{fields.src}}"
            field:
              label: "ছবি"
              name: "src"
              widget: "image"

          - label: "ক্যাটাগরি সমূহ"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - label: "আইডি (এটা পরিবর্তন করবেন না)"
                name: "id"
                widget: "string"
                required: true

              - label: "ক্যাটাগরির নাম"
                name: "name"
                widget: "string"
                required: true

              - label: "কার্ডের উপরের আইকন ছবি (না দিলে ইমোজি থাকবে)"
                name: "icon"
                widget: "image"
                required: false

              - label: "গ্যালারির ছবি (সর্বোচ্চ ২০টা)"
                name: "images"
                widget: "list"
                summary: "{{fields.src}}"
                field:
                  label: "ছবি"
                  name: "src"
                  widget: "image"
